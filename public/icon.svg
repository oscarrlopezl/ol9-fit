<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="metalGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>
    <linearGradient id="limeGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#bdf200"/>
      <stop offset="100%" stop-color="#eab308"/>
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Background industrial polygon -->
  <polygon points="256,24 472,130 472,382 256,488 40,382 40,130" fill="url(#metalGrad)" stroke="#334155" stroke-width="12"/>
  <polygon points="256,48 448,142 448,370 256,464 64,370 64,142" fill="none" stroke="url(#limeGold)" stroke-width="4" opacity="0.6"/>
  <!-- Bolt rivets -->
  <circle cx="80" cy="148" r="8" fill="#475569" stroke="#1e293b" stroke-width="3"/>
  <circle cx="432" cy="148" r="8" fill="#475569" stroke="#1e293b" stroke-width="3"/>
  <circle cx="432" cy="364" r="8" fill="#475569" stroke="#1e293b" stroke-width="3"/>
  <circle cx="80" cy="364" r="8" fill="#475569" stroke="#1e293b" stroke-width="3"/>
  <!-- Industrial text OL9 -->
  <text x="256" y="270" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="900" font-size="124" fill="url(#limeGold)" letter-spacing="4" filter="url(#neonGlow)">OL9</text>
  <text x="256" y="340" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="800" font-size="44" fill="#94a3b8" letter-spacing="12">FIT</text>
  <line x1="160" y1="365" x2="352" y2="365" stroke="#eab308" stroke-width="4" stroke-linecap="round"/>
</svg>
